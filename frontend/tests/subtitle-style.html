<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Subtitle style UI test</title></head><body>
<div id="app"></div>
<script type="module">
import { createApp, h, reactive, ref } from 'vue';
import SubtitleStyleEditor from '../src/components/SubtitleStyleEditor.vue';
import '../src/style.css';
import '../src/prototype/prototype.css';
import '../src/studio.css';
createApp({setup(){
 const settings=reactive({video_orientation:'portrait',subtitle_layouts:{}}),variant=ref('both');
 window.testSettings=settings;window.testVariant=variant;
 return ()=>h('div',{class:'live-studio',style:'display:block;max-width:560px;padding:24px;margin:auto;background:#202526;color:#e7e9eb'},[
 h(SubtitleStyleEditor,{settings,variant:variant.value,'onUpdate:variant':v=>variant.value=v,orientationControl:true})]);
}}).mount('#app');
</script></body></html>
