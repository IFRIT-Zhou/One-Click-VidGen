<!doctype html><html><meta charset="utf-8"><div id="app"></div><script type="module">
import {createApp,h} from 'vue'
import VideoStudio from '../src/components/VideoStudio.vue'
import '../src/style.css'
const record={id:'motion-ui',revision:1,status:'image_review',settings:{name:'静态切动态测试',ratio:'16:9'},creation_parameters:{},references:[],scenes:[{slide_id:'s1',text:'测试字幕',start:0,end:8}],shots:[{id:'shot1',kind:'static',start:0,end:8,duration:8,slide_ids:['s1'],intent:'测试镜头',image_prompt:'核心图：山顶人物',image_status:'completed',action:'',video_prompt:''}],scene_assets:[],logs:[]}
if(location.search.includes('structure')){
 record.audio='assets/audio.wav'
 record.scenes=[{slide_id:'s1',text:'前半句',start:0,end:4},{slide_id:'s2',text:'后半句',start:4,end:8}]
 record.shots[0].slide_ids=['s1','s2']
 if(location.search.includes('motions'))record.status='video_review'
}
window.requests=[];window.record=record
window.fetch=async(url,options={})=>{
 const p=new URL(url,location.href).pathname;let result={}
 if(options.method==='POST'){
  const body=JSON.parse(options.body||'{}');window.requests.push({path:p,body})
  if(p.endsWith('/motion')){Object.assign(record.shots[0],body);record.revision++;result=record}
  else if(p.endsWith('/refresh-prompts')){record.shots[0].action=body.action||'衣袖随风摆动';record.shots[0].motion_plan={beats:[{action:'衣袖随风摆动'}]};if(!body.action_only)record.shots[0].video_prompt='按核心图生成：衣袖随风摆动，镜头稳定';record.revision++;result=record}
 }else if(p==='/api/video-studio/motion-ui')result=record
 else if(p==='/api/video-studio')result={items:[record]}
 else if(p==='/api/language-presets')result={presets:[],current:{}}
 else if(p==='/api/comfyui'||p==='/api/director-profiles')result={profiles:[]}
 return new Response(JSON.stringify(result))
}
sessionStorage.setItem('ocv-video-open',record.id)
createApp({render:()=>h(VideoStudio)}).mount('#app')
</script></html>
