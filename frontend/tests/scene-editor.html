<!doctype html><html><meta charset="utf-8"><div id="app"></div><script type="module">
import {createApp,h} from 'vue'
import VideoStudio from '../src/components/VideoStudio.vue'
import '../src/style.css'
const record={id:'scene-ui',revision:1,status:'image_review',settings:{name:'场景编辑测试',ratio:'16:9',dynamic_text_mode:'visual_first'},creation_parameters:{dynamic_text_mode:'visual_first'},references:[],scenes:[{slide_id:'s1',text:'测试字幕',start:0,end:8}],shots:[{id:'shot1',kind:'static',start:0,end:8,duration:8,slide_ids:['s1'],intent:'测试镜头',image_prompt:'镜头提示词',image_status:'completed'}],scene_assets:[{id:'scene1',name:'手术室',asset_kind:'scene_reference',used_by:['shot1'],image_prompt:'场景提示词',image_status:'completed',reference_ids:[]}],scene_references_status:'completed',logs:[]}
window.fetch=async(url,options={})=>{const p=new URL(url,location.href).pathname;let result={};if(p==='/api/video-studio/scene-ui')result=record;else if(p==='/api/video-studio')result={items:[record]};else if(p==='/api/language-presets')result={presets:[],current:{}};else if(p==='/api/comfyui'||p==='/api/director-profiles')result={profiles:[]};return new Response(JSON.stringify(result))}
sessionStorage.setItem('ocv-video-open',record.id)
createApp({render:()=>h(VideoStudio)}).mount('#app')
</script></html>
