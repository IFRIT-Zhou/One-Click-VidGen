upstream zt_frontend_5173 {
    server 10.201.211.22:5173 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name oneclickvidgen.com www.oneclickvidgen.com;

    return 301 https://oneclickvidgen.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name oneclickvidgen.com www.oneclickvidgen.com;

    ssl_certificate /etc/nginx/ssl/oneclickvidgen.com/oneclickvidgen.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/oneclickvidgen.com/oneclickvidgen.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:oneclickvidgen_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/oneclickvidgen_access.log;
    error_log /var/log/nginx/oneclickvidgen_error.log;

    client_max_body_size 0;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Ray Serve is an internal implementation detail. Public clients must use
    # the authenticated cloud-api gateway under /api/v1/.
    location ^~ /api/tts/ {
        return 404;
    }

    location / {
        proxy_pass http://zt_frontend_5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~* \.(m3u8)$ {
        proxy_pass http://zt_frontend_5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache video_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }

    location ~* \.(ts|m4s|mp4|webm|mov)$ {
        proxy_pass http://zt_frontend_5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache video_cache;
        proxy_cache_valid 200 206 24h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }
}
