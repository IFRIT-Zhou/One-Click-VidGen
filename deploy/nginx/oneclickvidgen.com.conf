server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name oneclickvidgen.com www.oneclickvidgen.com;

    return 301 https://oneclickvidgen.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name oneclickvidgen.com www.oneclickvidgen.com;

    ssl_certificate /etc/nginx/ssl/oneclickvidgen.com/oneclickvidgen.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/oneclickvidgen.com/oneclickvidgen.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:oneclickvidgen_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/oneclickvidgen_access.log;
    error_log /var/log/nginx/oneclickvidgen_error.log;

    client_max_body_size 0;
    root /var/www/oneclickvidgen;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Ray Serve is an internal implementation detail. Public clients must use
    # the authenticated cloud-api gateway under /api/v1/.
    location ^~ /api/tts/ {
        return 404;
    }

    # HTML must always be revalidated so it cannot reference a stale asset set.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Static assets are versioned in HTML and can be cached safely.
    location ^~ /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /one-click-vidgen-logo.png {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
