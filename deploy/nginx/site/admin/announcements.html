<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>公告管理｜管理后台</title><link rel="stylesheet" href="/assets/site.css?v=20260930-ux4"><link rel="stylesheet" href="/assets/announcements.css?v=20261110-1"></head>
<body><header class="site-header"><div class="shell header-inner"><a class="brand" href="/admin/"><img src="/one-click-vidgen-logo.png" alt="One-Click VidGen"><span><strong>One-Click VidGen</strong><small>运营控制台</small></span></a><nav class="nav" aria-label="后台导航"><a href="/admin/">返回管理后台</a><a href="/announcements/" target="_blank" rel="noopener">查看公开公告</a></nav></div></header>
<main class="shell announcement-admin"><div class="eyebrow">PLATFORM ANNOUNCEMENTS</div><h1>公告管理</h1><p>草稿仅管理员可见。发布后同步展示在官网和客户端；归档后停止公开展示。</p><p id="announcement-admin-login" hidden>请先<a href="/admin/">登录管理员账号</a>，再返回本页。</p><div id="announcement-admin-message" class="announcement-message" role="status"></div>
<div id="announcement-admin-content" hidden><div class="announcement-toolbar"><label for="announcement-filter">状态</label><select id="announcement-filter"><option value="">全部</option><option value="draft">草稿</option><option value="published">已发布</option><option value="archived">已归档</option></select><button class="button secondary" id="announcement-refresh" type="button">刷新列表</button><button class="button primary" id="announcement-new" type="button">新建公告</button><span id="announcement-count"></span></div>
<div class="announcement-workspace"><section class="announcement-list-panel" aria-label="公告列表"><div id="announcement-admin-list"></div><button type="button" id="announcement-admin-more" class="button secondary" hidden>加载更多</button></section><section class="announcement-editor"><h2 id="announcement-editor-heading">新建公告</h2><p id="announcement-editor-status">草稿尚未保存</p><form id="announcement-form"><label class="announcement-field">标题<input id="announcement-title" maxlength="160" required></label><label class="announcement-field">正文<textarea id="announcement-body" maxlength="10000" required placeholder="填写向用户说明的调整内容，仅支持纯文本。"></textarea></label><label><input id="announcement-pinned" type="checkbox"> 置顶展示</label><div class="announcement-actions"><button class="button secondary" id="announcement-save" type="button">保存草稿</button><button class="button primary" id="announcement-publish" type="button">发布公告</button><button class="button secondary" id="announcement-archive" type="button" disabled>归档</button></div></form><div class="announcement-preview"><strong>内容预览</strong><h3 id="announcement-preview-title">公告标题</h3><div id="announcement-preview-body" class="announcement-body">正文预览将在这里显示。</div></div></section></div></div></main>
<script src="/assets/session-refresh.js?v=20261110-1" defer></script><script src="/assets/admin-announcements.js?v=20261110-1" defer></script></body></html>
